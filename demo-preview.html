<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; background: #1e293b; padding: 24px; display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .section { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .section h3 { font-size: 12px; font-weight: 800; color: #475569; margin-bottom: 10px; text-align: center; background: #f1f5f9; padding: 6px; border-radius: 6px; }
  .ppo-page { background: #fff; width: 595px; padding: 20px 18px; border: 1px solid #e2e8f0; }
  .ppo-doc-title { text-align: center; font-size: 0.95rem; font-weight: 800; padding: 7px 12px; margin-bottom: 10px; border-bottom: 2px solid #1e293b; letter-spacing: 1px; color: #1e293b; }
  .ppo-grid { display: grid; gap: 8px; align-items: stretch; }
  .ppo-grid-2 { grid-template-columns: repeat(2, 1fr); }
  .ppo-grid-3 { grid-template-columns: repeat(3, 1fr); }
  .ppo-table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; text-align: center; border: 1px solid #e2e8f0; }
  .ppo-table th, .ppo-table td { border: 1px solid #e2e8f0; overflow: hidden; white-space: nowrap; }
  .ppo-class-th { background: #1e293b !important; color: #fff; font-weight: 900; letter-spacing: 0.5px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .ppo-day-th { background: #f1f5f9 !important; font-weight: 700; color: #475569; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .ppo-pd-td { background: #f8fafc; font-weight: 700; color: #94a3b8; }
  .ppo-disabled-td { background: #f1f5f9; }
  .ppo-sp-name-th { font-weight: 800; text-align: center; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .ppo-sp-day-th { background: #f1f5f9 !important; font-weight: 700; color: #475569; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .sp-divider { margin-top: 10px; border-top: 1.5px solid #e2e8f0; padding-top: 8px; }
  .size-2 .ppo-table { font-size: 11px; }
  .size-2 .ppo-table th, .size-2 .ppo-table td { height: 20px; padding: 3px 2px; font-size: 10.5px; }
  .size-2 .ppo-class-th { font-size: 13px; padding: 8px 4px; }
  .size-2 .ppo-col-pd { width: 26px; }
  .size-3 .ppo-table { font-size: 10.5px; }
  .size-3 .ppo-table th, .size-3 .ppo-table td { height: 17px; padding: 2px 1px; font-size: 10px; }
  .size-3 .ppo-class-th { font-size: 12px; padding: 7px 4px; }
  .size-3 .ppo-col-pd { width: 24px; }

  /* 범례 */
  .legend { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #475569; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.1); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
</style>
</head>
<body>
<script>
const DAYS = ['월','화','수','목','금'];
const PERIODS = {월:6,화:6,수:5,목:6,금:6};
const maxP = 6;

// 전담 과목 정의 (이름 + 색상)
const SPECIALISTS = [
  { name: '체육', bg: '#dbeafe' },  // 파랑
  { name: '음악', bg: '#dcfce7' },  // 초록
  { name: '미술', bg: '#fef9c3' },  // 노랑
  { name: '영어', bg: '#ede9fe' },  // 보라
];

// 전담 배정표: [전담인덱스, 반, 요일, 교시]
const SP_ASSIGNMENTS = [
  [0, 1, '월', 1], [0, 1, '월', 2], [0, 2, '화', 0], [0, 2, '화', 1],
  [0, 3, '수', 2], [0, 4, '목', 3],
  [1, 1, '화', 3], [1, 2, '수', 0], [1, 3, '목', 1], [1, 4, '금', 2],
  [2, 1, '수', 4], [2, 2, '목', 2], [2, 3, '금', 0], [2, 4, '월', 3],
  [3, 1, '목', 0], [3, 1, '목', 1], [3, 2, '금', 3], [3, 3, '월', 4], [3, 4, '화', 5],
];

// spMap[반][요일][교시] = specialist
const spMap = {};
SP_ASSIGNMENTS.forEach(([spIdx, cls, day, period]) => {
  if (!spMap[cls]) spMap[cls] = {};
  if (!spMap[cls][day]) spMap[cls][day] = {};
  spMap[cls][day][period] = SPECIALISTS[spIdx];
});

// 일반 과목 배열
const SUBS = ['국어','수학','사회','과학','도덕','국어','수학'];

function buildClass(classNum) {
  let h = `<table class="ppo-table"><colgroup><col class="ppo-col-pd">${DAYS.map(()=>'<col>').join('')}</colgroup>`;
  h += `<thead><tr><th class="ppo-class-th">${classNum}반</th>${DAYS.map(d=>`<th class="ppo-day-th">${d}</th>`).join('')}</tr></thead><tbody>`;
  for (let r = 0; r < maxP; r++) {
    h += `<tr><td class="ppo-pd-td">${r+1}</td>`;
    DAYS.forEach(d => {
      if (r < PERIODS[d]) {
        const sp = spMap[classNum]?.[d]?.[r];
        if (sp) {
          // 전담 배정 셀 → 전담 색상 + 전담 과목명
          const style = `background-color:${sp.bg};-webkit-print-color-adjust:exact;print-color-adjust:exact;font-weight:bold;`;
          h += `<td style="${style}">${sp.name}</td>`;
        } else {
          const sub = SUBS[(classNum + r + DAYS.indexOf(d)) % SUBS.length];
          h += `<td>${sub}</td>`;
        }
      } else {
        h += `<td class="ppo-disabled-td"></td>`;
      }
    });
    h += `</tr>`;
  }
  return h + `</tbody></table>`;
}

function buildSp(sp) {
  let h = `<table class="ppo-table"><colgroup><col class="ppo-col-pd">${DAYS.map(()=>'<col>').join('')}</colgroup>`;
  h += `<thead>
    <tr><th class="ppo-sp-name-th" colspan="6" style="background:${sp.bg};color:#1e293b;-webkit-print-color-adjust:exact;print-color-adjust:exact;">${sp.name}</th></tr>
    <tr><th class="ppo-sp-day-th"></th>${DAYS.map(d=>`<th class="ppo-sp-day-th">${d}</th>`).join('')}</tr>
  </thead><tbody>`;
  for (let r = 0; r < maxP; r++) {
    h += `<tr><td class="ppo-pd-td">${r+1}</td>`;
    DAYS.forEach(d => {
      if (r < PERIODS[d]) {
        // 이 전담이 배정된 반 찾기
        const assignedClasses = SP_ASSIGNMENTS
          .filter(([sIdx, cls, aDay, aPeriod]) => SPECIALISTS[sIdx].name === sp.name && aDay === d && aPeriod === r)
          .map(([,cls]) => `${cls}반`).join(',');
        const style = assignedClasses ? `background-color:${sp.bg};-webkit-print-color-adjust:exact;print-color-adjust:exact;` : '';
        h += `<td style="${style}">${assignedClasses}</td>`;
      } else h += `<td class="ppo-disabled-td"></td>`;
    });
    h += `</tr>`;
  }
  return h + `</tbody></table>`;
}

// ── 4반 예시 ──
const sec = document.createElement('div');
sec.className = 'section';
sec.innerHTML = `<h3>📌 4반 예시 — 전담 색상이 반별 시간표에 반영됨</h3>`;

// 범례
const legend = document.createElement('div');
legend.className = 'legend';
SPECIALISTS.forEach(sp => {
  legend.innerHTML += `<div class="legend-item"><div class="legend-dot" style="background:${sp.bg};"></div>${sp.name}</div>`;
});
sec.appendChild(legend);

const page = document.createElement('div');
page.className = 'ppo-page size-2';
page.innerHTML = `
  <div class="ppo-doc-title">3학년 1주차 주간학습안내</div>
  <div class="ppo-grid ppo-grid-2">${[1,2,3,4].map(buildClass).join('')}</div>
  <div class="sp-divider">
    <div class="ppo-doc-title" style="margin-top:0;">전담 시간표</div>
    <div class="ppo-grid ppo-grid-2">${SPECIALISTS.map(buildSp).join('')}</div>
  </div>`;
sec.appendChild(page);
document.body.appendChild(sec);
</script>
</body>
</html>
